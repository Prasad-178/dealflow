services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: dealflow-db
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: dealflow
      POSTGRES_PASSWORD: dealflow
      POSTGRES_DB: dealflow
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
